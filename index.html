<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLink Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .content {
            background: rgba(255, 255, 255, 0.92);
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            max-width: 650px;
        }
        h1 {
            font-weight: 700;
            color: #2c3e50;
        }
        h2 {
            color: #34495e;
            font-weight: 400;
        }
        .lead {
            font-style: italic;
            color: #555;
        }
        .btn-primary {
            background-color: #1e90ff;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="text-center content mx-auto">
            <h1 class="display-4 mb-3">GiftLink</h1>
            <h2 class="mb-4">Share Gifts and Joy!</h2>
            <p class="lead mb-4">"Sharing is the essence of community. It is through giving that we enrich and elevate our lives and the lives of others."</p>
            <a href="#app" class="btn btn-primary">Get Started</a>
        </div>
    </div>
</body>
</html>
